
name: Daily Engineering Journal

on:
  schedule:
    # 18:30 UTC = 00:30 Bangladesh time (next day)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-engineering-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's entry
        run: python scripts/generate_daily.py

      - name: Configure commit identity
        env:
          COMMIT_NAME: ${{ vars.DAILY_COMMIT_NAME }}
          COMMIT_EMAIL: ${{ secrets.DAILY_COMMIT_EMAIL }}
        run: |
          if [ -z "$COMMIT_NAME" ] || [ -z "$COMMIT_EMAIL" ]; then
            echo "::error::Configure DAILY_COMMIT_NAME and DAILY_COMMIT_EMAIL first."
            exit 1
          fi
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"

      - name: Commit and push today's entry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add journal/

          if git diff --cached --quiet; then
            echo "No new journal entry to commit."
            exit 0
          fi

          git commit -m "docs: add daily engineering journal"
          git push origin "HEAD:${DEFAULT_BRANCH}"
